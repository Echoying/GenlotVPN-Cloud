# 中间件机（10.27.0.91）：MySQL / Redis / Nacos
# 采用 host 网络模式，端口直接占用宿主机，无需 ports 映射。
# 用法：sh deploy.sh base
services:
  ruoyi-mysql:
    container_name: ruoyi-mysql
    image: mysql:5.7
    build:
      context: ./mysql
    network_mode: host
    volumes:
      - ./mysql/conf:/etc/mysql/conf.d
      - ./mysql/logs:/logs
      - ./mysql/data:/var/lib/mysql
      - ./mysql/db:/docker-entrypoint-initdb.d
    command: [
          'mysqld',
          '--innodb-buffer-pool-size=1G',
          '--character-set-server=utf8mb4',
          '--collation-server=utf8mb4_unicode_ci',
          '--default-time-zone=+8:00',
          '--lower-case-table-names=1'
        ]
    environment:
      MYSQL_DATABASE: 'ry-cloud'
      MYSQL_ROOT_PASSWORD: Gv9mKp7Qx2nLw4sR8tYwZ6

  ruoyi-redis:
    container_name: ruoyi-redis
    image: redis:7.2
    build:
      context: ./redis
    network_mode: host
    environment:
      - TZ=Asia/Shanghai
    volumes:
      - ./redis/conf/redis.conf:/home/ruoyi/redis/redis.conf
      - ./redis/data:/data
      - ./redis/logs:/home/ruoyi/redis/logs
    command: redis-server /home/ruoyi/redis/redis.conf

  ruoyi-nacos:
    container_name: ruoyi-nacos
    image: nacos/nacos-server:v2.4.2
    build:
      context: ./nacos
    network_mode: host
    environment:
      - TZ=Asia/Shanghai
      - MODE=standalone
    volumes:
      - ./nacos/logs/:/home/nacos/logs
      - ./nacos/conf/application.properties:/home/nacos/conf/application.properties
    # Nacos 连接 MySQL 走别名 ruoyi-mysql，host 模式下解析到本机
    extra_hosts:
      - "ruoyi-mysql:${MIDDLEWARE_HOST}"
    depends_on:
      - ruoyi-mysql
