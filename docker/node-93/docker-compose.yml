# VPN 机（10.27.0.93）：vpn-auth（桌面端 TCP 9443 / HTTP 9400）
# 采用 host 网络模式；中间件别名解析到 91；
# 微服务显式注入 SPRING_CLOUD_NACOS_DISCOVERY_IP=本机，跨机 Feign 调用 yianlian/auth 可达。
# 用法：sh deploy.sh up

# 中间件别名 → 中间件机（91）
x-middleware-hosts: &middleware-hosts
  - "ruoyi-nacos:${MIDDLEWARE_HOST}"
  - "ruoyi-redis:${MIDDLEWARE_HOST}"
  - "ruoyi-mysql:${MIDDLEWARE_HOST}"

services:
  ruoyi-vpn-auth:
    container_name: ruoyi-vpn-auth
    build:
      context: ./ruoyi/vpn/auth
      dockerfile: dockerfile
    network_mode: host
    environment:
      - TZ=Asia/Shanghai
      - SPRING_CLOUD_NACOS_DISCOVERY_IP=${VPN_HOST}
    extra_hosts: *middleware-hosts
    volumes:
      - ./ruoyi/vpn/auth/certs:/home/ruoyi/certs:ro
      - ./ruoyi/vpn/auth/logs:/home/ruoyi/logs
      - ./ruoyi/vpn/auth/jar/ruoyi-vpn-auth.jar:/home/ruoyi/ruoyi-vpn-auth.jar:ro
