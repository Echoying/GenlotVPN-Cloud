worker_processes  1;
events { worker_connections  1024; }
http {
    include       mime.types;
    default_type  application/octet-stream;
    sendfile      on;
    client_max_body_size 0;
    server {
        listen 80;
        server_name _;
        return 301 https://$host$request_uri;
    }
    server {
        listen 443 ssl;
        server_name _;
        ssl_certificate     /etc/nginx/certs/download.crt;
        ssl_certificate_key /etc/nginx/certs/download.key;
        autoindex off;
        location = /genlotvpn/download/manifest.json {
            alias /home/ruoyi/download-files/manifest.json;
            default_type application/json;
        }
        location /genlotvpn/download/files/ {
            alias /home/ruoyi/download-files/apps/;
            autoindex off;
            add_header Content-Disposition "attachment";
        }
        # alias + try_files 在官方 nginx 上不可靠，且 fallback /index.html
        # 会落到 location / 的 404。改用 brief 允许的 root 写法，使
        # /genlotvpn/download/ 与 /genlotvpn/manual/ 都落到同一 index.html。
        location /genlotvpn/ {
            root /home/ruoyi;
            try_files $uri /genlotvpn/index.html;
        }
        location / { return 404; }
    }
}
