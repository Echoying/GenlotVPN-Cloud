# 管理端机（10.27.0.92）：gateway / auth / system / gen / job / file / monitor / yianlian + nginx
# 采用 host 网络模式；中间件别名通过 extra_hosts 解析到 91；
# 微服务显式注入 SPRING_CLOUD_NACOS_DISCOVERY_IP，确保注册到 Nacos 的是本机 IP。
# 用法：sh deploy.sh app

# 中间件别名 → 中间件机（91）
x-middleware-hosts: &middleware-hosts
  - "ruoyi-nacos:${MIDDLEWARE_HOST}"
  - "ruoyi-redis:${MIDDLEWARE_HOST}"
  - "ruoyi-mysql:${MIDDLEWARE_HOST}"

services:
  ruoyi-gateway:
    container_name: ruoyi-gateway
    build:
      context: ./ruoyi/gateway
      dockerfile: dockerfile
    network_mode: host
    environment:
      - TZ=Asia/Shanghai
      - SPRING_CLOUD_NACOS_DISCOVERY_IP=${APP_HOST}
    extra_hosts: *middleware-hosts

  ruoyi-auth:
    container_name: ruoyi-auth
    build:
      context: ./ruoyi/auth
      dockerfile: dockerfile
    network_mode: host
    environment:
      - TZ=Asia/Shanghai
      - SPRING_CLOUD_NACOS_DISCOVERY_IP=${APP_HOST}
    extra_hosts: *middleware-hosts

  ruoyi-modules-system:
    container_name: ruoyi-modules-system
    build:
      context: ./ruoyi/modules/system
      dockerfile: dockerfile
    network_mode: host
    environment:
      - TZ=Asia/Shanghai
      - SPRING_CLOUD_NACOS_DISCOVERY_IP=${APP_HOST}
    extra_hosts: *middleware-hosts

  ruoyi-modules-gen:
    container_name: ruoyi-modules-gen
    build:
      context: ./ruoyi/modules/gen
      dockerfile: dockerfile
    network_mode: host
    environment:
      - TZ=Asia/Shanghai
      - SPRING_CLOUD_NACOS_DISCOVERY_IP=${APP_HOST}
    extra_hosts: *middleware-hosts

  ruoyi-modules-job:
    container_name: ruoyi-modules-job
    build:
      context: ./ruoyi/modules/job
      dockerfile: dockerfile
    network_mode: host
    environment:
      - TZ=Asia/Shanghai
      - SPRING_CLOUD_NACOS_DISCOVERY_IP=${APP_HOST}
    extra_hosts: *middleware-hosts

  ruoyi-modules-file:
    container_name: ruoyi-modules-file
    build:
      context: ./ruoyi/modules/file
      dockerfile: dockerfile
    network_mode: host
    environment:
      - TZ=Asia/Shanghai
      - SPRING_CLOUD_NACOS_DISCOVERY_IP=${APP_HOST}
    extra_hosts: *middleware-hosts
    volumes:
      - ./ruoyi/uploadPath:/home/ruoyi/uploadPath

  ruoyi-visual-monitor:
    container_name: ruoyi-visual-monitor
    build:
      context: ./ruoyi/visual/monitor
      dockerfile: dockerfile
    network_mode: host
    environment:
      - TZ=Asia/Shanghai
      - SPRING_CLOUD_NACOS_DISCOVERY_IP=${APP_HOST}
    extra_hosts: *middleware-hosts

  ruoyi-modules-yianlian:
    container_name: ruoyi-modules-yianlian
    build:
      context: ./ruoyi/modules/yianlian
      dockerfile: dockerfile
    network_mode: host
    environment:
      - TZ=Asia/Shanghai
      - SPRING_CLOUD_NACOS_DISCOVERY_IP=${APP_HOST}
    extra_hosts: *middleware-hosts

  ruoyi-nginx:
    container_name: ruoyi-nginx
    image: nginx
    build:
      context: ./nginx
    network_mode: host
    environment:
      - TZ=Asia/Shanghai
    volumes:
      - ./nginx/html/dist:/home/ruoyi/projects/ruoyi-ui
      - ./nginx/conf/nginx.conf:/etc/nginx/nginx.conf
      - ./nginx/logs:/var/log/nginx
      - ./nginx/conf.d:/etc/nginx/conf.d
    # nginx.conf 代理到 ruoyi-gateway:8080，解析到本机
    extra_hosts:
      - "ruoyi-gateway:${APP_HOST}"
    depends_on:
      - ruoyi-gateway
