syntax = "proto3";

package vpn;

option java_package = "com.ruoyi.vpn.protocol";
option java_multiple_files = true;

// --- 验证码 ---
message GetCaptchaRequest {}

message GetCaptchaResponse {
  bool captcha_enabled = 1;
  string uuid = 2;
  string img_base64 = 3;
}

// --- 登录 ---
message LoginRequest {
  string username = 1;
  string password = 2;
  string app_id = 3;
  string code = 4;
  string uuid = 5;
  string login_purpose = 6;
  string client_ip = 7;
  string client_os = 8;
  string client_mac = 9;
  string app_name = 10;
}

message LoginResponse {
  string access_token = 1;
  int64 expires_in = 2;
  bytes session_key = 3;
  repeated string role_keys = 4;
}

// --- 修改密码 ---
message ChangePasswordRequest {
  string username = 1;
  string old_password = 2;
  string new_password = 3;
  string app_id = 4;
}

message ChangePasswordResponse {}

// --- 登出 / 刷新 ---
message LogoutRequest {}
message LogoutResponse {}

message RefreshTokenRequest {}
message RefreshTokenResponse {}

// --- 客户端登录审计 ---
message ReportClientLoginRequest {
  string app_id = 1;
  string app_name = 2;
  string client_type = 3;
  bool success = 4;
  string msg = 5;
  string stage = 6;
  string client_ip = 7;
  string client_os = 8;
  string client_mac = 9;
}

message ReportClientLoginResponse {}
