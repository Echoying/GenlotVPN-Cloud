# 已合并到 sql/update/ruoyi-vpn-auth-dev.yml
#
# 操作步骤：
# 1. 打开 Nacos → 配置管理 → 找到或新建 ruoyi-vpn-auth-dev.yml
# 2. 将 ruoyi-vpn-auth-dev.yml 全文粘贴/合并（注意保留你环境里的 redis 密码等）
# 3. 确认 vpn.tcp.enabled=true、port=9443
# 4. 重启 ruoyi-vpn-auth
# 5. Docker 部署需在 docker-compose 映射 9443:9443，并放行防火墙 TCP 9443
#
# 说明：
# - server.port=9400 为 HTTP（Web 登录），在 bootstrap.yml，无需改网关
# - vpn.tcp.port=9443 为桌面客户端 TCP，直连 ruoyi-vpn-auth，不经 ruoyi-vpn-gateway
# - 生产 TLS：见 ruoyi-vpn-auth-prod-tls.yml 与 ruoyi-vpn-client/docs/TLS_PINNING.md
