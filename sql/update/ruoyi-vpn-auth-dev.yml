# Nacos 配置：Data ID = ruoyi-vpn-auth-dev.yml，Group = DEFAULT_GROUP
# 桌面客户端走 TCP 9443（不经 vpn-gateway）；Web 端 ruoyi-vpn-ui 仍走 HTTP 9400/网关

spring:
  redis:
    host: ruoyi-redis
    port: 6379
    password:

vpn:
  aes:
    key: EnSwordAgent@123
    iv: 321@tnegAdrowSnE
  captcha:
    enabled: true
    type: math
  # 桌面端 Protobuf RPC（GenlotVPN 客户端直连本端口）
  tcp:
    enabled: true
    port: 9443
    tls:
      # 开发/内网联调可 false；生产见 ruoyi-vpn-auth-prod-tls.yml
      enabled: false
      cert-path:
      key-path:
      # --- 生产 TLS 示例（取消注释并设 enabled: true）---
      # enabled: true
      # cert-path: /home/ruoyi/certs/server.crt
      # key-path: /home/ruoyi/certs/server.key
      # 本地 jar: cert-path: D:/cursor/genlot/GenlotVPN-Cloud/docker/ruoyi/vpn/auth/certs/server.crt
    security:
      timestamp-skew-sec: 60
      nonce-ttl-sec: 300
      max-frame-bytes: 1048576
      # 读空闲断开：30 分钟无入站 RPC 流量则断开（0=不启用）
      idle-timeout-minutes: 30
    limits:
      # 单 IP 最大并发 TCP 连接数（0=不限制）
      max-connections-per-ip: 5
      # 单 IP 登录频率：60 秒内最多 10 次 Login RPC
      login-max-attempts-per-ip: 10
      login-rate-window-seconds: 60
  line-verify:
    code-ttl-minutes: 5
    send-cooldown-seconds: 60
    max-verify-attempts: 5
    line-name-max-length: 64

dingtalk:
  robot:
    enabled: false
    access-token:
    secret:
    webhook-url: https://oapi.dingtalk.com/robot/send
