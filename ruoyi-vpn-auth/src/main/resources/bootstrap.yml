# Tomcat
server:
  port: 9400

# VPN AES加密配置
vpn:
  aes:
    key: EnSwordAgent@123
    iv: 321@tnegAdrowSnE
  captcha:
    enabled: true
    type: math
  tcp:
    enabled: true
    port: 9443
    tls:
      enabled: false
      cert-path:
      key-path:
    security:
      timestamp-skew-sec: 60
      nonce-ttl-sec: 300
      max-frame-bytes: 1048576

# Spring
spring: 
  application:
    # 应用名称
    name: ruoyi-vpn-auth
  profiles:
    # 环境配置
    active: dev
  cloud:
    nacos:
      discovery:
        # 服务注册地址
        server-addr: ruoyi-nacos:8848
      config:
        # 配置中心地址
        server-addr: ruoyi-nacos:8848
        # 配置文件格式
        file-extension: yml
        # 共享配置
        shared-configs:
          - application-${spring.profiles.active}.${spring.cloud.nacos.config.file-extension}
